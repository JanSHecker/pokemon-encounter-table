name: Deploy Encounter Table

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encounter-table-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q api/test_app.py

      - name: Compile Python sources
        run: python -m compileall -q api tools

  deploy:
    name: Deploy to bronze-brawl.de
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bronze-brawl.de/encounter-table/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy main on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy.sh"

      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused \
            https://bronze-brawl.de/encounter-table/ >/dev/null
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused \
            https://bronze-brawl.de/encounter-table/api/encounters >/dev/null
